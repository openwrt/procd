name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - i386_pentium4
          - aarch64_generic
          - arm_cortex-a15_neon-vfpv4
          - mips_24kc
          - mipsel_24kc
          - powerpc_8548
        packages:
          - procd procd-selinux procd-ujail procd-seccomp uxc
        include:
          - arch: riscv64_generic
            packages: procd procd-selinux procd-ujail uxc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        env:
          ARTIFACTS: ${{ runner.temp }}/artifacts
          PACKAGES: ${{ matrix.packages }}
        run: |
          mkdir -p "$ARTIFACTS"
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE" "$ARTIFACTS"
          docker run --rm \
            --env PACKAGES \
            --volume "$GITHUB_WORKSPACE:/procd" \
            --volume "$GITHUB_WORKSPACE/.github/scripts:/ci:ro" \
            --volume "$ARTIFACTS:/artifacts" \
            ghcr.io/openwrt/sdk:${{ matrix.arch }}-master \
            /ci/sdk-build.sh

      - name: Restore ownership
        if: always()
        env:
          ARTIFACTS: ${{ runner.temp }}/artifacts
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$ARTIFACTS"

      - name: Sizes
        env:
          ARTIFACTS: ${{ runner.temp }}/artifacts
        run: |
          {
            echo "### ${{ matrix.arch }}"
            echo "| package | apk size |"
            echo "| :--- | ---: |"
            awk '{ printf "| %s | %s |\n", $1, $2 }' "$ARTIFACTS/sizes.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: ${{ runner.temp }}/artifacts/apk/
          if-no-files-found: error

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/artifacts/logs/
          if-no-files-found: ignore
